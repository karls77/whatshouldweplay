# Fetches the BGG collection and publishes the site to GitHub Pages.
# Runs on every push to main, once a day, and on demand (Actions tab → Run workflow).
name: Update collection and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 9 * * *" # daily, 09:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run tests
        run: |
          python3 -m unittest discover -s tests
          node --test

      - name: Fetch collection from BoardGameGeek
        env:
          BGG_USERNAME: ${{ vars.BGG_USERNAME || 'ratpfink' }}
          BGG_TOKEN: ${{ secrets.BGG_TOKEN }}
        run: python3 scripts/fetch_bgg.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
